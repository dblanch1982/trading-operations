services:
  operations:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/operations;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - operations-data:/app/data
    restart: unless-stopped

volumes:
  operations-data:
