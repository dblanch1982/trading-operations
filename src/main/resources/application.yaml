spring:
  application:
    name: operations
  ai:
    mcp:
      server:
        name: trading-operations-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
